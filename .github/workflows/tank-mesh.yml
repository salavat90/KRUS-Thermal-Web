name: 3D tank mesh validation
on:
  push:
    paths:
      - '3d/annulus-tetra.js'
      - '3d/layered-tetra.js'
      - '3d/random-points.js'
      - '3d/unified-tank-mesh.js'
      - 'tests/tank-unified-mesh.cjs'
      - 'tests/tank-random-points.cjs'
      - 'tests/tank-layered-tetra.cjs'
      - 'tests/tank-tetra.cjs'
      - '.github/workflows/tank-mesh.yml'
  workflow_dispatch:
jobs:
  mesh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tetrahedral topology
        run: |
          node tests/tank-tetra.cjs
          node tests/tank-layered-tetra.cjs
          node tests/tank-random-points.cjs
          node tests/tank-unified-mesh.cjs
