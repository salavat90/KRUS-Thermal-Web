name: 3D thermal FEM laboratory
on:
  push:
    paths:
      - '3d/tetra-thermal.js'
      - '3d/tetra-slice.js'
      - '3d/attachments-heat.js'
      - '3d/unified-fem.js'
      - '3d/fem-interface-audit.js'
      - '3d/full-vessel-contract.js'
      - 'tests/tank-full-vessel-contract.cjs'
      - 'tests/tank-interface-audit.cjs'
      - 'tests/tank-unified-fem.cjs'
      - '3d/fem-lab.html'
      - 'tests/tank-primary-ui.cjs'
      - 'tests/tank-attachments.cjs'
      - 'tests/tank-tetra-slice.cjs'
      - '3d/layered-tetra.js'
      - 'tests/tank-tetra-thermal.cjs'
      - '.github/workflows/tank-thermal.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Random tetrahedral FEM numerical benchmark
        run: |
          node tests/tank-tetra-thermal.cjs
          node tests/tank-tetra-slice.cjs
          node tests/tank-attachments.cjs
          node tests/tank-unified-fem.cjs
          node tests/tank-primary-ui.cjs
          node tests/tank-interface-audit.cjs
          node tests/tank-full-vessel-contract.cjs
