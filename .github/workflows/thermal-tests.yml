name: Thermal solver tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  thermal-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax check
        run: node --check tests/solver-smoke.cjs
      - name: Thermal solver smoke tests
        run: node tests/solver-smoke.cjs
      - name: Validate ELCUT reference schema
        run: |
          node -e "const d=require('./validation/elcut-reference.json');if(d.cases.length!==15||d.cases.some(c=>!Number.isFinite(c.heatLossReferenceWm)))process.exit(1);console.log('15 ELCUT reference cases structurally valid; NOT numerically validated')"
